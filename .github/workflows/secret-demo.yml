name: GitHub Secret Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Show secret directly
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Direct value:"
          echo "$DEMO_SECRET"

      - name: Encode secret as Base64
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Base64 encoded value:"
          printf '%s' "$DEMO_SECRET" | base64

      - name: Decode it again
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          ENCODED=$(printf '%s' "$DEMO_SECRET" | base64)
          echo "Encoded: $ENCODED"
          echo "Decoded:"
          printf '%s' "$ENCODED" | base64 --decode
